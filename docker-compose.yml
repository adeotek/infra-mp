services:
  homelab-manager:
    build: .
    image: homelab-manager:latest
    container_name: homelab-manager
    ports:
      - "8000:8000"
    volumes:
      - homelab-data:/data
    environment:
      HOMELAB_DATA_DIR: /data
      HOMELAB_SECRET_KEY: ${HOMELAB_SECRET_KEY:-change-me-to-a-long-random-string}
      HOMELAB_ADMIN_USERNAME: ${HOMELAB_ADMIN_USERNAME:-admin}
      # Set this (e.g. in a .env file) to pin the initial admin password;
      # otherwise a random one is generated and printed on first start.
      HOMELAB_ADMIN_PASSWORD: ${HOMELAB_ADMIN_PASSWORD:-}
    restart: unless-stopped

volumes:
  homelab-data:
