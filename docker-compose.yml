name: infra-mp

services:
  infra-mp:
    build: .
    image: infra-mp:latest
    container_name: infra-mp
    ports:
      - "8000:8000"
    volumes:
      - infra-mp-data:/data
    # Hardening: no extra kernel capabilities, no privilege escalation, a
    # read-only rootfs (writes only to /data and the /tmp tmpfs needed by the
    # backup restore/export pipelines). Note: binds 0.0.0.0 by design — the
    # app is reachable across the LAN; set INFRAMP_ALLOWED_HOSTS to the
    # explicit hostnames/IPs clients use instead of the "*" default.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    environment:
      INFRAMP_APP_NAME: ${INFRAMP_APP_NAME:-InfraMP}
      INFRAMP_DATA_DIR: /data
      INFRAMP_SECRET_KEY: ${INFRAMP_SECRET_KEY:-change-me-to-a-long-random-string}
      INFRAMP_SESSION_COOKIE_NAME: ${INFRAMP_SESSION_COOKIE_NAME:-infra_mp_session}
      INFRAMP_SESSION_TTL_DAYS: ${INFRAMP_SESSION_TTL_DAYS:-7}
      INFRAMP_COOKIE_SECURE: ${INFRAMP_COOKIE_SECURE:-}
      # Set this (e.g. in a .env file) to the hostnames/IPs clients actually use
      # — leaving "*" disables TrustedHost validation (Host-header trust).
      INFRAMP_ALLOWED_HOSTS: ${INFRAMP_ALLOWED_HOSTS:-*}
      INFRAMP_TRUSTED_PROXY_IPS: ${INFRAMP_TRUSTED_PROXY_IPS:-}
      INFRAMP_HSTS_ENABLED: ${INFRAMP_HSTS_ENABLED:-false}
      INFRAMP_LOGIN_MAX_ATTEMPTS: ${INFRAMP_LOGIN_MAX_ATTEMPTS:-5}
      INFRAMP_LOGIN_WINDOW_SECONDS: ${INFRAMP_LOGIN_WINDOW_SECONDS:-600}
      INFRAMP_LOGIN_COOLDOWN_SECONDS: ${INFRAMP_LOGIN_COOLDOWN_SECONDS:-600}
      INFRAMP_MAX_BACKUP_UPLOAD_BYTES: ${INFRAMP_MAX_BACKUP_UPLOAD_BYTES:-52428800}
      INFRAMP_MAX_BACKUP_DB_BYTES: ${INFRAMP_MAX_BACKUP_DB_BYTES:-262144000}
      INFRAMP_ADMIN_USERNAME: ${INFRAMP_ADMIN_USERNAME:-admin}
      # Set this (e.g. in a .env file) to pin the initial admin password;
      # otherwise a random one is generated and written to a 0600 file in
      # /data on first start.
      INFRAMP_ADMIN_PASSWORD: ${INFRAMP_ADMIN_PASSWORD:-}
      INFRAMP_ADMIN_DISPLAY_NAME: ${INFRAMP_ADMIN_DISPLAY_NAME:-Administrator}
      INFRAMP_DEBUG: ${INFRAMP_DEBUG:-false}
      # Embedded MCP server (agents access /mcp with UI-generated API tokens).
      INFRAMP_MCP_ENABLED: ${INFRAMP_MCP_ENABLED:-true}
      # Public base URL advertised in the MCP authentication metadata; set to
      # the externally reachable URL when clients connect from other machines.
      INFRAMP_BASE_URL: ${INFRAMP_BASE_URL:-http://localhost:8000}
    restart: unless-stopped

volumes:
  infra-mp-data:
