<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <script>
    /* Apply persisted theme + sidebar state before paint to avoid a flash. */
    (function () {
      try {
        var t = localStorage.getItem('inframp-theme') || 'dark';
        document.documentElement.setAttribute('data-theme', t);
        if (localStorage.getItem('inframp-sidebar') === 'collapsed') {
          document.documentElement.classList.add('sidebar-collapsed');
        }
      } catch (e) { /* ignore */ }
    })();
  </script>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
{% if current_user %}
<div class="layout">
  <aside class="sidebar">
    <a class="sidebar-brand" href="/dashboard">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
      <span class="brand-text">{{ app_name }}</span>
    </a>
    <nav class="side-nav">
      <a href="/dashboard" class="nav-item{% if current_path in ('/dashboard', '/') %} active{% endif %}">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
        <span class="nav-label">Dashboard</span>
      </a>
      <a href="/entities" class="nav-item{% if current_path.startswith('/entities') or current_path.startswith('/records') or current_path.startswith('/attributes') %} active{% endif %}">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path></svg>
        <span class="nav-label">Entities</span>
      </a>
      <a href="/views" class="nav-item{% if current_path.startswith('/views') %} active{% endif %}">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
        <span class="nav-label">Views</span>
      </a>
      {% if current_user.role == 'admin' %}
      <a href="/users" class="nav-item{% if current_path.startswith('/users') %} active{% endif %}">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
        <span class="nav-label">Users</span>
      </a>
      {% endif %}
    </nav>
    <button class="sidebar-toggle" id="sidebar-toggle" type="button" title="Collapse menu" aria-label="Collapse menu">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="11 17 6 12 11 7"></polyline><polyline points="18 17 13 12 18 7"></polyline></svg>
      <span class="nav-label">Collapse</span>
    </button>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar-right">
        <button class="icon-btn theme-toggle" id="theme-toggle" type="button" title="Toggle theme" aria-label="Toggle theme">
          <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
          <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>
        <div class="user-menu" id="user-menu">
          <span class="role-badge role-{{ current_user.role }}">{{ current_user.role }}</span>
          <button class="user-menu-btn" id="user-menu-btn" type="button" aria-haspopup="true" aria-expanded="false">
            <span class="user-name">{{ current_user.display_name or current_user.username }}</span>
            <svg class="icon chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </button>
          <div class="user-menu-dropdown" role="menu">
            <a href="/settings/password" class="dropdown-item" role="menuitem">Change Password</a>
            <form method="post" action="/logout">
              <button type="submit" class="dropdown-item" role="menuitem">Log out</button>
            </form>
          </div>
        </div>
      </div>
    </header>

    <main class="content">
{% else %}
<main class="content content-standalone">
{% endif %}
      {% if flash %}
      <div class="flash flash-{{ flash_type }}">{{ flash }}</div>
      {% endif %}
      {% block content %}{% endblock %}
{% if current_user %}
    </main>
  </div>
</div>
{% else %}
</main>
{% endif %}
</body>
</html>
