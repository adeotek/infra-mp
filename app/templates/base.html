<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <script>
    /* Apply persisted theme + sidebar state before paint to avoid a flash. */
    (function () {
      try {
        var t = localStorage.getItem('inframp-theme') || 'dark';
        document.documentElement.setAttribute('data-theme', t);
        if (localStorage.getItem('inframp-sidebar') === 'collapsed') {
          document.documentElement.classList.add('sidebar-collapsed');
        }
      } catch (e) { /* ignore */ }
    })();
  </script>
  <link rel="stylesheet" href="/static/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
{% if current_user %}
<div class="layout">
  <aside class="sidebar">
    <a class="sidebar-brand" href="/dashboard" title="{{ app_name }}">
      <i class="fa-solid fa-server" aria-hidden="true"></i>
      <span class="brand-text">{{ app_name }}</span>
    </a>
    <nav class="side-nav">
      <a href="/dashboard" class="nav-item{% if current_path in ('/dashboard', '/') %} active{% endif %}" title="Dashboard" aria-label="Dashboard">
        <i class="fa-solid fa-gauge" aria-hidden="true"></i>
        <span class="nav-label">Dashboard</span>
      </a>
      <a href="/entities" class="nav-item{% if current_path.startswith('/entities') or current_path.startswith('/records') or current_path.startswith('/attributes') %} active{% endif %}" title="Entities" aria-label="Entities">
        <i class="fa-solid fa-database" aria-hidden="true"></i>
        <span class="nav-label">Entities</span>
      </a>
      <a href="/views" class="nav-item{% if current_path.startswith('/views') %} active{% endif %}" title="Views" aria-label="Views">
        <i class="fa-solid fa-list" aria-hidden="true"></i>
        <span class="nav-label">Views</span>
      </a>
      {% if current_user.role == 'admin' %}
      <a href="/users" class="nav-item{% if current_path.startswith('/users') %} active{% endif %}" title="Users" aria-label="Users">
        <i class="fa-solid fa-users" aria-hidden="true"></i>
        <span class="nav-label">Users</span>
      </a>
      {% endif %}
    </nav>
    <button class="sidebar-toggle" id="sidebar-toggle" type="button" title="Collapse menu" aria-label="Collapse menu">
      <i class="fa-solid fa-angles-left" aria-hidden="true"></i>
      <span class="nav-label">Collapse</span>
    </button>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar-right">
        <button class="icon-btn theme-toggle" id="theme-toggle" type="button" title="Toggle theme" aria-label="Toggle theme">
          <i class="fa-solid fa-sun icon-sun" aria-hidden="true"></i>
          <i class="fa-solid fa-moon icon-moon" aria-hidden="true"></i>
        </button>
        <div class="user-menu" id="user-menu">
          <span class="role-badge role-{{ current_user.role }}">{{ current_user.role }}</span>
          <button class="user-menu-btn" id="user-menu-btn" type="button" aria-haspopup="true" aria-expanded="false">
            <span class="user-name">{{ current_user.display_name or current_user.username }}</span>
            <i class="fa-solid fa-chevron-down chevron" aria-hidden="true"></i>
          </button>
          <div class="user-menu-dropdown" role="menu">
            <a href="/settings/password" class="dropdown-item" role="menuitem"><i class="fa-solid fa-key" aria-hidden="true"></i> Change Password</a>
            <form method="post" action="/logout">
              <button type="submit" class="dropdown-item" role="menuitem"><i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i> Log out</button>
            </form>
          </div>
        </div>
      </div>
    </header>

    <main class="content">
{% else %}
<main class="content content-standalone">
{% endif %}
      {% if flash %}
      <div class="flash flash-{{ flash_type }}">{{ flash }}</div>
      {% endif %}
      {% block content %}{% endblock %}
{% if current_user %}
    </main>
  </div>
</div>
{% else %}
</main>
{% endif %}
</body>
</html>
