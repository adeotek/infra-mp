{% extends "base.html" %}
{% block title %}Edit widget — {{ app_name }}{% endblock %}
{% block content %}
<h1>Edit widget</h1>
<form method="post" action="/dashboard/widgets/{{ widget.id }}/edit">
  {% include "_csrf.html" %}
  <div class="grid-2">
    <label>Title
      <input type="text" name="title" value="{{ widget.title }}">
    </label>
    <label>Type
      <select name="widget_type" id="widget-type">
        <option value="table" {% if widget.widget_type == 'table' %}selected{% endif %}>Table</option>
        <option value="count" {% if widget.widget_type == 'count' %}selected{% endif %}>Count</option>
        <option value="sum" {% if widget.widget_type == 'sum' %}selected{% endif %}>Sum (numeric field)</option>
      </select>
    </label>
    <label>Entity
      <select name="entity_id" id="widget-entity">
        <option value="">— none —</option>
        {% for e in entities %}
        <option value="{{ e.id }}" {% if widget.entity_id == e.id %}selected{% endif %}>{{ e.name }}</option>
        {% endfor %}
      </select>
    </label>
    <label>Field (sum widgets)
      <select name="field" id="widget-field">
        <option value="">— none —</option>
        {% for e in numeric_fields %}
        {% for f in e.fields %}
        <option value="{{ f.slug }}" {% if widget.config.get('field') == f.slug and widget.entity_id == e.id %}selected{% endif %}>{{ e.name }} · {{ f.name }}</option>
        {% endfor %}
        {% endfor %}
      </select>
    </label>
    <label>View (optional filter)
      <select name="view_id">
        <option value="">— none —</option>
        {% for v in views %}
        <option value="{{ v.id }}" {% if widget.view_id == v.id %}selected{% endif %}>{{ v.name }}</option>
        {% endfor %}
      </select>
    </label>
    <label>Width (12-column grid)
      <select name="width">
        {% set span = widget.width if widget.width.isdigit() else {'1/4': '3', '1/2': '6', '3/4': '9', 'full': '12'}.get(widget.width, '6') %}
        {% for n in range(1, 13) %}
        <option value="{{ n }}" {% if span == n|string %}selected{% endif %}>{{ n }} / 12</option>
        {% endfor %}
      </select>
    </label>
  </div>
  <div class="form-actions">
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="/dashboard/config" class="btn">Cancel</a>
  </div>
</form>
{# Numeric attributes per entity: the sum field select follows the entity. #}
<script type="application/json" id="numeric-fields">{{ numeric_fields | tojson }}</script>
{% endblock %}
