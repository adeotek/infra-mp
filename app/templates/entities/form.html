{% extends "base.html" %}
{% block title %}{{ "Edit entity" if entity else "New entity" }} — {{ app_name }}{% endblock %}
{% block content %}
<h1>{{ "Edit entity" if entity else "New entity" }}</h1>
{% if error %}<div class="flash flash-error">{{ error }}</div>{% endif %}
<form method="post" action="{{ '/entities/' ~ entity.id ~ '/edit' if entity else '/entities' }}">
  <label>Name
    <input type="text" name="name" required value="{{ entity.name if entity else '' }}" autofocus>
  </label>
  <label>Description
    <input type="text" name="description" value="{{ entity.description if entity else '' }}">
  </label>
  <label>Icon (optional)
    <input type="text" name="icon" value="{{ entity.icon if entity else '' }}" placeholder="e.g. server">
  </label>
  <div class="form-actions">
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="/entities" class="btn">Cancel</a>
  </div>
</form>
{% endblock %}
