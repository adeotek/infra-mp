{% extends base_template %}
{% block title %}Change password — {{ app_name }}{% endblock %}
{% block content %}
<h1>Change password</h1>
{% if error %}<div class="flash flash-error">{{ error }}</div>{% endif %}
<form method="post" action="/settings/password" class="form-narrow" {% if is_fragment %}hx-post="/settings/password" hx-target="#modal-body"{% endif %}>
  <label>Current password <span class="req">*</span>
    <input type="password" name="current_password" required autocomplete="current-password" autofocus>
  </label>
  <label>New password <span class="req">*</span>
    <input type="password" name="new_password" required minlength="8" autocomplete="new-password">
  </label>
  <label>Confirm new password <span class="req">*</span>
    <input type="password" name="confirm_password" required autocomplete="new-password">
  </label>
  <div class="form-actions">
    <button type="submit" class="btn btn-primary">Change password</button>
    <a href="/dashboard" class="btn" data-modal-close>Cancel</a>
  </div>
</form>
{% endblock %}
