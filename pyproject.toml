[project]
name = "infra-mp"
dynamic = ["version"]
description = "Self-hosted infrastructure, hardware, and configuration manager for home labs and small data centers."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "George Benjamin-Schonberger", email = "george.benjamin@gmail.com" },
]
keywords = [
  "self-hosted",
  "homelab",
  "infrastructure",
  "inventory",
  "asset-management",
  "dcim",
  "fastapi",
  "htmx",
  "sqlite",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Systems Administration",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "jinja2>=3.1",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.3",
    "alembic>=1.13",
    "mcp>=2.0,<3",
]

[project.urls]
Homepage = "https://github.com/adeotek/infra-mp"
Repository = "https://github.com/adeotek/infra-mp"
Issues = "https://github.com/adeotek/infra-mp/issues"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.version]
path = "app/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injection uses calls in default arguments idiomatically.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Security",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Cookie",
    "app.auth.dependencies.require_capability",
]
